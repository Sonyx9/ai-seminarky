name: Deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Dokud web běží jen na GitHub Pages (staging), buildí se se SITE_ENV=staging → noindex + robots Disallow.
      # Ostrý provoz: SITE_ENV=production + PROD_SITE (vlastní doména přes CNAME) – přepnout až po schválení.
      - run: npm run build
        env:
          SITE_ENV: ${{ vars.SITE_ENV || 'staging' }}
          STAGING_SITE: ${{ vars.STAGING_SITE || 'https://sonyx9.github.io' }}
          STAGING_BASE: ${{ vars.STAGING_BASE || '/ai-seminarky' }}
          PROD_SITE: ${{ vars.PROD_SITE }}
          PUBLIC_FORM_ENDPOINT: ${{ secrets.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
